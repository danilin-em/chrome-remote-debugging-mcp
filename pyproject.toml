[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chrome-remote-debugging-mcp"
version = "0.1.0"
description = "MCP server for controlling Chrome over the DevTools Protocol (CDP)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Evgenii Danilin", email = "evgenii.danilin.m@gmail.com" }]
keywords = ["mcp", "chrome", "cdp", "devtools", "remote-debugging"]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "websockets>=12.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
chrome-remote-debugging-mcp = "chrome_remote_debugging_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chrome_remote_debugging_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["chrome_remote_debugging_mcp"]
omit = ["*/__main__.py"]  # entry shim: only runs under `python -m`, no logic

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    'if __name__ == .__main__.:',
]
